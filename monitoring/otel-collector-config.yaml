# OpenTelemetry Collector Configuration for OpenDiscourse
# Provides comprehensive observability with cloudcurio.cc integration

receivers:
  # Prometheus metrics receiver
  prometheus:
    config:
      scrape_configs:
        - job_name: 'opendiscourse-ingestion'
          static_configs:
            - targets: ['localhost:8000']
          scrape_interval: 10s
          metrics_path: '/metrics'

  # PostgreSQL database receiver
  postgresql:
    endpoint: "postgresql://opendiscourse:opendiscourse123@100.90.23.60:5432/opendiscourse"
    collection_interval: 30s
    tls:
      insecure: true

  # Host metrics receiver
  hostmetrics:
    collection_interval: 30s
    scrapers:
      - cpu
      - disk
      - filesystem
      - load
      - memory
      - network
      - processes

  # Application logs receiver
  filelog:
    include:
      - /var/log/opendiscourse/*.log
      - ./logs/*.log
    start_at: beginning
    include_file_name: false
    include_file_path: true
    operators:
      - type: json_parser
        timestamp:
          parse_from: timestamp
          layout: '%Y-%m-%dT%H:%M:%S.%L'
      - type: move
        from: attributes
        to: resource

  # Application metrics receiver
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Resource detection and enrichment
  resourcedetection:
    detectors: [env, gcp, aws, azure]
    timeout: 2s
    override: false

  # Resource attributes
  resource:
    attributes:
      - key: service.name
        value: opendiscourse-ingestion
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert
      - key: deployment.environment
        value: "production"
        action: upsert
      - key: cloud.provider
        value: "homelab"
        action: upsert

  # Batch processing for efficiency
  batch:
    send_batch_size: 1000
    send_batch_max_size: 2000
    timeout: 5s

  # Memory limiter
  memory_limiter:
    limit_mib: 512

  # Metric transformations
  metricstransform:
    transforms:
      - include: "opendiscourse_ingestion_*"
        action: update
        new_name: "ingestion_records_total"
      - include: "process_*"
        action: update
        new_name: "system_process_"

  # Data filtering
  filter:
    metrics:
      include:
        match_type: regexp
        metric_names: [opendiscourse_.*, system_.*, database_.*]
    logs:
      include:
        match_type: regexp
        attributes:
          [service.name, level]

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # Z-pages for debugging
  zpages:
    endpoint: 0.0.0.0:55679

exporters:
  # Export to cloudcurio.cc OpenTelemetry endpoint
  otlp/cloudcurio:
    endpoint: "https://cloudcurio.cc:443"
    headers:
      Authorization: "Bearer ${CLOUDCURIO_OTEL_TOKEN}"
    tls:
      insecure: false
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Local Prometheus for backup
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "opendiscourse"
    const_labels:
      environment: "production"

  # Loki for log aggregation
  loki:
    endpoint: "https://cloudcurio.cc/loki/api/v1/push"
    headers:
      Authorization: "Bearer ${CLOUDCURIO_LOKI_TOKEN}"
    tls:
      insecure: false
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

  # File exporter for debugging
  file:
    path: ./logs/otel-export.json
    rotation:
      max_megabytes: 100
      max_files: 10

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # Metrics pipeline
    metrics:
      receivers: [prometheus, postgresql, hostmetrics, otlp]
      processors: [resourcedetection, resource, batch, memory_limiter, metricstransform, filter]
      exporters: [otlp/cloudcurio, prometheus]

    # Logs pipeline
    logs:
      receivers: [filelog, otlp]
      processors: [resourcedetection, resource, batch, memory_limiter, filter]
      exporters: [otlp/cloudcurio, loki]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch, memory_limiter]
      exporters: [otlp/cloudcurio]

  # Telemetry for the collector itself
  telemetry:
    logs:
      level: "info"
    metrics:
      address: 0.0.0.0:8888
    resource:
      attributes:
        service.name: opendiscourse-otel-collector
        service.version: "1.0.0"