# ============================================================================
# File: ansible/group_vars/db.yml
# Summary:
#   Shared PostgreSQL configuration for all [db] hosts.
#   Adjust credentials and DB/role names as needed.
# ============================================================================

# Save as: group_vars/db.yml

# PostgreSQL connection / auth
postgresql_db_name: opendiscourse
postgresql_app_user: opendiscourse
postgresql_app_password: "opendiscourse123"   # Consider managing via Ansible Vault.
postgresql_encoding: "UTF8"
postgresql_lc_collate: "en_US.UTF-8"
postgresql_lc_ctype: "en_US.UTF-8"

# Network binding / security
postgresql_listen_addresses: "localhost"   # Tight by default; open via pg_hba.conf if needed.
postgresql_port: 5432

# Core extensions for analytics + text search; extend as needed.
postgresql_extensions:
  - pgcrypto
  - "uuid-ossp"
  - pg_trgm
  - btree_gin
  - btree_gist
  - hstore
  - citext

# Schema + table deployment settings
# Path on controller to .sql files that define your gov-data tables.
postgresql_schema_sql_dir: "ansible/sql"

# Generic ingestion schema/table flags (created by role).
postgresql_create_core_ingestion_schema: true
postgresql_core_schema_name: ingestion

# Idempotent DDL patterns for extension gov-data tables.
# Add a .sql file per data source with CREATE TABLE IF NOT EXISTS ...
# and ON CONFLICT patterns for upserts.
postgresql_govdata_sql_files:
  - committees.sql
  - members.sql
  - bills.sql
  - votes.sql
  - hearings.sql


# ============================================================================
# File: ansible/group_vars/cloudflare.yml
# Summary:
#   Cloudflare + Hyperdrive configuration.
#   All secrets should be stored via Ansible Vault or environment overrides.
# ============================================================================

# Save as: group_vars/cloudflare.yml

# Cloudflare credentials (ideally vaulted)
cloudflare_api_token: "YOUR_CLOUDFLARE_API_TOKEN_HERE"
cloudflare_account_id: "YOUR_ACCOUNT_ID"
cloudflare_zone_id: "YOUR_ZONE_ID"

# Worker + Hyperdrive naming
cloudflare_worker_name: "opendiscourse-ingest-worker"
cloudflare_hyperdrive_config_name: "opendiscourse-postgres-hd"

# Public domain used by your worker
cloudflare_worker_route_hostname: "api.opendiscourse.net"   # or api.cloudcurio.cc
cloudflare_worker_route_pattern: "api.opendiscourse.net/ingest/*"

# PostgreSQL target for Hyperdrive (must be reachable from Cloudflare)
# For homelab DBs, you might front this with a tunneling solution so
# Cloudflare can reach a public endpoint; Hyperdrive itself needs
# an externally reachable hostname.

hyperdrive_postgres_host: "your-public-db-hostname-or-tunnel"  # e.g. db.cloudcurio.cc
hyperdrive_postgres_port: 5432
hyperdrive_postgres_database: "opendiscourse"
hyperdrive_postgres_user: "opendiscourse"
hyperdrive_postgres_password: "opendiscourse123"             # vault this in real life

# Optional AI / multi-agent endpoints consumed by the Worker
# These could be your own MCP server, Ollama API, OpenRouter, etc.
ingest_ai_endpoint_url: "https://mcp.opendiscourse.net/ingest-agent"  # example


# ============================================================================
# Role: postgres_setup
# Path: ansible/roles/postgres_setup/tasks/main.yml
# Summary:
#   Install and configure PostgreSQL, extensions, and core schemas/tables.
# ============================================================================

# Save as: roles/postgres_setup/tasks/main.yml

---
- name: "postgres_setup | Install PostgreSQL packages"
  package:
    name: "{{ postgres_packages }}"
    state: present

- name: "postgres_setup | Ensure PostgreSQL service is enabled and running"
  service:
    name: "{{ postgres_service_name }}"
    enabled: true
    state: started

- name: "postgres_setup | Ensure PostgreSQL data directory is initialized (if needed)"
  command: "postgresql-setup --initdb"
  args:
    creates: "/var/lib/pgsql/data/PG_VERSION"
  when: ansible_os_family == 'RedHat'
  register: postgres_initdb
  changed_when: postgres_initdb.rc == 0
  failed_when: postgres_initdb.rc not in [0,1]

- name: "postgres_setup | Adjust postgresql.conf listen_addresses and port (if supported)"
  lineinfile:
    path: "/var/lib/pgsql/data/postgresql.conf"
    regexp: '^#?listen_addresses = .*$'
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
  when: ansible_os_family == 'RedHat'
  notify: restart postgresql

- name: "postgres_setup | Ensure database user exists"
  become_user: postgres
  postgresql_user:
    name: "{{ postgresql_app_user }}"
    password: "{{ postgresql_app_password }}"
    state: present

- name: "postgres_setup | Ensure database exists"
  become_user: postgres
  postgresql_db:
    name: "{{ postgresql_db_name }}"
    owner: "{{ postgresql_app_user }}"
    encoding: "{{ postgresql_encoding }}"
    lc_collate: "{{ postgresql_lc_collate }}"
    lc_ctype: "{{ postgresql_lc_ctype }}"
    template: template0
    state: present

- name: "postgres_setup | Install extensions in target DB"
  become_user: postgres
  postgresql_ext:
    db: "{{ postgresql_db_name }}"
    name: "{{ item }}"
    state: present
  loop: "{{ postgresql_extensions }}"

- name: "postgres_setup | Create core ingestion schema (if enabled)"
  become_user: postgres
  postgresql_schema:
    db: "{{ postgresql_db_name }}"
    name: "{{ postgresql_core_schema_name }}"
    state: present
  when: postgresql_create_core_ingestion_schema | default(true)

- name: "postgres_setup | Create core ingestion tables"
  become_user: postgres
  postgresql_query:
    db: "{{ postgresql_db_name }}"
    query: "{{ lookup('file', 'roles/postgres_setup/templates/core_ingestion_tables.sql.j2') }}"
  vars:
    ingestion_schema: "{{ postgresql_core_schema_name }}"

- name: "postgres_setup | Deploy gov-data SQL table definitions (20+ tables)"
  become_user: postgres
  vars:
    gov_sql_path: "{{ postgresql_schema_sql_dir }}/{{ item }}"
  postgresql_query:
    db: "{{ postgresql_db_name }}"
    # Each .sql file should:
    #   - Use CREATE TABLE IF NOT EXISTS
    #   - Use optimized data types (bigint, text, timestamptz, jsonb, etc.)
    #   - Define PRIMARY KEY / UNIQUE constraints
    #   - Optionally add indexes for lookup columns.
    #   - Include ON CONFLICT DO UPDATE/NOTHING in upsert statements.
    query: "{{ lookup('file', gov_sql_path) }}"
  loop: "{{ postgresql_govdata_sql_files }}"
  when: postgresql_govdata_sql_files is defined


# ============================================================================
# Role: postgres_setup | Handlers
# Path: ansible/roles/postgres_setup/handlers/main.yml
# ============================================================================

# Save as: roles/postgres_setup/handlers/main.yml

---
- name: restart postgresql
  service:
    name: "{{ postgres_service_name }}"
    state: restarted


# ============================================================================
# Role: postgres_setup | Template: core_ingestion_tables.sql.j2
# Path: ansible/roles/postgres_setup/templates/core_ingestion_tables.sql.j2
# Summary:
#   Core ingestion + progress-tracking tables used by Cloudflare Workers
#   and other ingestion agents. You will create source-specific tables in
#   `ansible/sql/*.sql` for the ~20 tables per data source.
# ============================================================================

-- Core schema for high-level ingestion jobs
CREATE TABLE IF NOT EXISTS {{ ingestion_schema }}.ingestion_jobs (
    job_id          uuid PRIMARY KEY DEFAULT uuid_generate_v4(),
    source_system   text NOT NULL,             -- e.g., 'govinfo', 'congress_api', 'openstates'
    source_type     text NOT NULL,             -- e.g., 'committees', 'members', 'bills'
    requested_range tsrange,                   -- optional: requested time or congress range
    status          text NOT NULL DEFAULT 'pending',  -- pending | running | succeeded | failed
    started_at      timestamptz,
    finished_at     timestamptz,
    total_records   bigint DEFAULT 0,
    new_records     bigint DEFAULT 0,
    updated_records bigint DEFAULT 0,
    duplicate_records bigint DEFAULT 0,
    error_count     bigint DEFAULT 0,
    error_message   text,
    metadata        jsonb DEFAULT '{}'::jsonb
);

CREATE INDEX IF NOT EXISTS idx_ingestion_jobs_source
    ON {{ ingestion_schema }}.ingestion_jobs (source_system, source_type);

-- Per-document log
CREATE TABLE IF NOT EXISTS {{ ingestion_schema }}.ingestion_documents (
    doc_id          text PRIMARY KEY,  -- stable unique ID from source (e.g., bill ID)
    job_id          uuid REFERENCES {{ ingestion_schema }}.ingestion_jobs(job_id) ON DELETE SET NULL,
    source_system   text NOT NULL,
    source_type     text NOT NULL,
    retrieved_at    timestamptz NOT NULL DEFAULT now(),
    last_updated_at timestamptz,
    payload         jsonb NOT NULL,
    hash_sha256     text NOT NULL,
    is_duplicate    boolean NOT NULL DEFAULT false,
    duplicate_of    text,
    metadata        jsonb DEFAULT '{}'::jsonb
);

CREATE INDEX IF NOT EXISTS idx_ingestion_documents_source
    ON {{ ingestion_schema }}.ingestion_documents (source_system, source_type);

CREATE INDEX IF NOT EXISTS idx_ingestion_documents_hash
    ON {{ ingestion_schema }}.ingestion_documents (hash_sha256);

-- Progress events for fine-grained status updates
CREATE TABLE IF NOT EXISTS {{ ingestion_schema }}.ingestion_events (
    event_id        bigserial PRIMARY KEY,
    job_id          uuid REFERENCES {{ ingestion_schema }}.ingestion_jobs(job_id) ON DELETE CASCADE,
    event_time      timestamptz NOT NULL DEFAULT now(),
    level           text NOT NULL DEFAULT 'info', -- info | warning | error
    message         text NOT NULL,
    context         jsonb DEFAULT '{}'::jsonb
);

CREATE INDEX IF NOT EXISTS idx_ingestion_events_job
    ON {{ ingestion_schema }}.ingestion_events (job_id, event_time);


# ============================================================================
# Example gov-data SQL file: ansible/sql/committees.sql
# Summary:
#   Example of an optimized table for committees data, with deduping pattern.
#   Extend this pattern to your ~20 tables for each data source.
# ============================================================================

-- Save as: ansible/sql/committees.sql

CREATE SCHEMA IF NOT EXISTS gov_committees;

CREATE TABLE IF NOT EXISTS gov_committees.committees (
    committee_id      text PRIMARY KEY,          -- canonical ID from source
    name              text NOT NULL,
    chamber           text NOT NULL,            -- 'House', 'Senate', 'Joint'
    congress          integer NOT NULL,
    parent_committee  text,
    url               text,
    updated_at        timestamptz NOT NULL DEFAULT now(),
    raw_payload       jsonb NOT NULL,
    metadata          jsonb DEFAULT '{}'::jsonb
);

CREATE INDEX IF NOT EXISTS idx_committees_congress
    ON gov_committees.committees (congress);

CREATE INDEX IF NOT EXISTS idx_committees_chamber
    ON gov_committees.committees (chamber);

-- Optional upsert helper; use from application or stored procedures
-- to avoid duplicates and track last-update time.

-- Example pattern (not executed automatically here):
-- INSERT INTO gov_committees.committees AS c (
