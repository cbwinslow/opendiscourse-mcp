# Example gov-data SQL file: ansible/sql/members.sql
# Summary:
#   Member dimension + relationship tables for govinfo-derived members.
#   These tables link person-level identifiers (e.g. bioguide_id) to bills
#   and actions, and store raw + enriched payloads from your upstream member
#   sources (govinfo BILLSTATUS, Congress.gov, OpenStates, etc.).
# ============================================================================

-- Save as: ansible/sql/members.sql

CREATE SCHEMA IF NOT EXISTS gov_members;

CREATE TABLE IF NOT EXISTS gov_members.members (
    bioguide_id      text PRIMARY KEY,              -- canonical ID where available
    member_id        text,                          -- generic member identifier from source
    govtrack_id      text,
    thomas_id        text,
    opensecrets_id   text,
    icpsr_id         text,

    first_name       text NOT NULL,
    middle_name      text,
    last_name        text NOT NULL,
    suffix           text,
    full_name        text GENERATED ALWAYS AS (
                        trim(both ' ' from concat_ws(' ', first_name, middle_name, last_name, suffix))
                      ) STORED,

    gender           text,
    party            text,
    state            text,
    district         text,
    chamber          text,                          -- 'House' | 'Senate' | 'Joint' (for committees)
    in_office        boolean,

    start_date       date,
    end_date         date,
    birthday         date,

    contact          jsonb DEFAULT '{}'::jsonb,     -- phones, emails, websites, socials
    roles            jsonb DEFAULT '{}'::jsonb,     -- full term history as array/object

    raw_payload      jsonb NOT NULL,                -- original upstream data (BILLSTATUS, etc.)
    metadata         jsonb DEFAULT '{}'::jsonb,

    updated_at       timestamptz NOT NULL DEFAULT now()
);

CREATE INDEX IF NOT EXISTS idx_members_state_chamber
    ON gov_members.members (state, chamber);

CREATE INDEX IF NOT EXISTS idx_members_party
    ON gov_members.members (party);

CREATE INDEX IF NOT EXISTS idx_members_in_office
    ON gov_members.members (in_office);


-- Relationship table linking bills to members with explicit roles
-- (sponsor, cosponsor, manager, etc.). This complements gov_bills.sponsors
-- and tightens the relationship by enforcing FKs to both sides.

CREATE TABLE IF NOT EXISTS gov_members.bill_member_roles (
    bill_id      text NOT NULL REFERENCES gov_bills.bills(bill_id) ON DELETE CASCADE,
    bioguide_id  text NOT NULL REFERENCES gov_members.members(bioguide_id) ON DELETE CASCADE,
    congress     integer NOT NULL,
    role         text NOT NULL,                     -- 'sponsor' | 'cosponsor' | 'manager' | etc.
    rank         integer,                           -- e.g., 1 for primary sponsor, 2... for cosponsors
    joined_at    timestamptz,

    metadata     jsonb DEFAULT '{}'::jsonb,

    PRIMARY KEY (bill_id, bioguide_id, role)
);

CREATE INDEX IF NOT EXISTS idx_bill_member_roles_member
    ON gov_members.bill_member_roles (bioguide_id, role);

CREATE INDEX IF NOT EXISTS idx_bill_member_roles_congress
    ON gov_members.bill_member_roles (congress);


