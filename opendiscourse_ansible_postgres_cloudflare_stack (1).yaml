# ============================================================================
# File: ansible/opendiscourse_stack.yml
# Author: cbwinslow & ChatGPT (GPT-5.1 Thinking)
# Date: 2025-11-23
# Summary:
#   Top-level Ansible playbook to:
#     1. Provision and configure PostgreSQL for OpenDiscourse data pipelines.
#     2. Install required PostgreSQL extensions.
#     3. Create core ingestion/analysis tables (generic + gov-data specific hooks).
#     4. Deploy Cloudflare Workers + Hyperdrive configs used for ingestion.
#     5. Wire ingestion workers to PostgreSQL using Hyperdrive.
#     6. Provide validation hooks, progress logging, and duplicate-prevention.
#
# Inputs:
#   - Inventory groups:
#       [db]           : PostgreSQL hosts.
#       [cloudflare]   : Deployment host that can talk to Cloudflare API (often localhost).
#   - group_vars/all.yml or group_vars/<group>.yml for:
#       postgres_*, cloudflare_* variables (defined below).
#
# Outputs:
#   - Fully configured PostgreSQL DB with core schemas/tables.
#   - Installed extensions (uuid-ossp, pgcrypto, pg_trgm, etc. – configurable).
#   - Cloudflare Worker + Hyperdrive config created/updated via API.
#   - Idempotent ingestion entrypoints with duplicate-prevention via ON CONFLICT.
#
# Notes:
#   - This is a monofile-style blueprint. All referenced paths are documented
#     further down in this same canvas so you can copy them into a repo.
#   - Extend table DDLs with your 20+ gov-data tables using the same patterns.
# ============================================================================

---
- name: "OpenDiscourse | Provision PostgreSQL + core schemas"
  hosts: db
  become: true
  vars:
    # These are defaults; override in group_vars/db.yml or host_vars as needed.
    postgres_packages:
      - postgresql
      - postgresql-contrib
      - postgresql-client
    postgres_service_name: postgresql

  roles:
    - role: postgres_setup


- name: "OpenDiscourse | Configure Cloudflare Workers + Hyperdrive ingestion"
  hosts: cloudflare
  gather_facts: true
  vars:
    # The Cloudflare deployment host typically runs wrangler + curl.
    wrangler_min_version: "3.0.0"
  roles:
    - role: cloudflare_ingest


