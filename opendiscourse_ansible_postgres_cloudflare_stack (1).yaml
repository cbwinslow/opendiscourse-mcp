# Additional Upgrade: PL/pgSQL Helper Functions for Members & Bill Roles
# Path: ansible/sql/members_functions.sql
# Summary:
#   Functions to handle JSON ingestion + upserts for members and
#   bill-member-role relationships directly inside PostgreSQL.
#   These allow agents and Cloudflare Workers to simply call:
#       SELECT gov_members.upsert_member_from_json(:json);
#       SELECT gov_members.upsert_bill_member_role_from_json(:json);
#   minimizing ingestion logic outside the DB.
# ============================================================================

-- Save as: ansible/sql/members_functions.sql

CREATE SCHEMA IF NOT EXISTS gov_members;

-- ============================================================================
-- Function: upsert_member_from_json(jsonb)
-- Purpose:
--   Accept a JSONB document from any source (govinfo BILLSTATUS, Congress.gov,
--   OpenStates, enrichment agents) and merge its content into gov_members.members.
-- Rules:
--   - bioguide_id is required as canonical key.
--   - Missing or null optional fields will not overwrite existing values.
--   - raw_payload is always stored.
--   - metadata is merged shallowly; override wins.
-- ============================================================================

CREATE OR REPLACE FUNCTION gov_members.upsert_member_from_json(p_member jsonb)
RETURNS void AS $$
DECLARE
    v_bioguide_id text := p_member->>'bioguide_id';
BEGIN
    IF v_bioguide_id IS NULL THEN
        RAISE EXCEPTION 'Missing bioguide_id in member JSON: %', p_member;
    END IF;

    INSERT INTO gov_members.members AS m (
        bioguide_id, member_id, govtrack_id, thomas_id, opensecrets_id, icpsr_id,
        first_name, middle_name, last_name, suffix,
        gender, party, state, district, chamber, in_office,
        start_date, end_date, birthday,
        contact, roles, raw_payload, metadata
    ) VALUES (
        v_bioguide_id,
        p_member->>'member_id',
        p_member->>'govtrack_id',
        p_member->>'thomas_id',
        p_member->>'opensecrets_id',
        p_member->>'icpsr_id',

        p_member->>'first_name',
        p_member->>'middle_name',
        p_member->>'last_name',
        p_member->>'suffix',

        p_member->>'gender',
        p_member->>'party',
        p_member->>'state',
        p_member->>'district',
        p_member->>'chamber',
        (p_member->>'in_office')::boolean,

        (p_member->>'start_date')::date,
        (p_member->>'end_date')::date,
        (p_member->>'birthday')::date,

        COALESCE(p_member->'contact', '{}'::jsonb),
        COALESCE(p_member->'roles', '{}'::jsonb),
        p_member,                           -- raw_payload
        COALESCE(p_member->'metadata', '{}'::jsonb)
    )
    ON CONFLICT (bioguide_id) DO UPDATE
      SET member_id      = COALESCE(EXCLUDED.member_id, m.member_id),
          govtrack_id    = COALESCE(EXCLUDED.govtrack_id, m.govtrack_id),
          thomas_id      = COALESCE(EXCLUDED.thomas_id, m.thomas_id),
          opensecrets_id = COALESCE(EXCLUDED.opensecrets_id, m.opensecrets_id),
          icpsr_id       = COALESCE(EXCLUDED.icpsr_id, m.icpsr_id),
          first_name     = EXCLUDED.first_name,
          middle_name    = EXCLUDED.middle_name,
          last_name      = EXCLUDED.last_name,
          suffix         = EXCLUDED.suffix,
          gender         = COALESCE(EXCLUDED.gender, m.gender),
          party          = COALESCE(EXCLUDED.party, m.party),
          state          = COALESCE(EXCLUDED.state, m.state),
          district       = COALESCE(EXCLUDED.district, m.district),
          chamber        = COALESCE(EXCLUDED.chamber, m.chamber),
          in_office      = COALESCE(EXCLUDED.in_office, m.in_office),
          start_date     = COALESCE(EXCLUDED.start_date, m.start_date),
          end_date       = COALESCE(EXCLUDED.end_date, m.end_date),
          birthday       = COALESCE(EXCLUDED.birthday, m.birthday),
          contact        = COALESCE(EXCLUDED.contact, m.contact),
          roles          = COALESCE(EXCLUDED.roles, m.roles),
          raw_payload    = EXCLUDED.raw_payload,
          metadata       = EXCLUDED.metadata,
          updated_at     = now();
END;
$$ LANGUAGE plpgsql;


-- ============================================================================
-- Function: upsert_bill_member_role_from_json(jsonb)
-- Purpose:
--   Accept a JSONB struct like:
--       {
--         "bill_id": "BILLS-118hr34ih",
--         "bioguide_id": "A000360",
--         "congress": 118,
--         "role": "sponsor",
--         "rank": 1,
--         "joined_at": "2024-02-01T12:00:00Z",
--         "metadata": {...}
--       }
--   and merge into gov_members.bill_member_roles.
-- ============================================================================

CREATE OR REPLACE FUNCTION gov_members.upsert_bill_member_role_from_json(p_link jsonb)
RETURNS void AS $$
DECLARE
    v_bill_id text := p_link->>'bill_id';
    v_bioguide_id text := p_link->>'bioguide_id';
    v_role text := p_link->>'role';
BEGIN
    IF v_bill_id IS NULL OR v_bioguide_id IS NULL OR v_role IS NULL THEN
        RAISE EXCEPTION 'Missing required fields in bill-member-role JSON: %', p_link;
    END IF;

    INSERT INTO gov_members.bill_member_roles AS r (
        bill_id, bioguide_id, congress, role, rank, joined_at, metadata
    ) VALUES (
        v_bill_id,
        v_bioguide_id,
        (p_link->>'congress')::integer,
        v_role,
        (p_link->>'rank')::integer,
        (p_link->>'joined_at')::timestamptz,
        COALESCE(p_link->'metadata', '{}'::jsonb)
    )
    ON CONFLICT (bill_id, bioguide_id, role) DO UPDATE
      SET rank      = COALESCE(EXCLUDED.rank, r.rank),
          joined_at = COALESCE(EXCLUDED.joined_at, r.joined_at),
          metadata  = EXCLUDED.metadata;
END;
$$ LANGUAGE plpgsql;


