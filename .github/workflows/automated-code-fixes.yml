name: Automated Code Fixes & Improvements

# Generic Automated Code Fixes and Improvements Template
# Automatically applies code formatting, fixes, and improvements

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: 'Apply automated fixes to code'
        required: false
        default: false
        type: boolean

jobs:
  code-formatting:
    name: Code Formatting & Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install formatting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort autopep8 flake8

    - name: Check code formatting with black
      run: |
        black --check --diff mcp_server tests

    - name: Apply black formatting
      if: github.event.inputs.apply_fixes == 'true' || github.event_name == 'push'
      run: |
        black mcp_server tests

    - name: Check import sorting
      run: |
        isort --check-only --diff mcp_server tests

    - name: Apply import sorting
      if: github.event.inputs.apply_fixes == 'true' || github.event_name == 'push'
      run: |
        isort mcp_server tests

    - name: Run flake8 linting
      run: |
        flake8 mcp_server tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Apply autopep8 fixes
      if: github.event.inputs.apply_fixes == 'true' || github.event_name == 'push'
      run: |
        autopep8 --in-place --aggressive --aggressive mcp_server tests

    - name: Commit formatting changes
      if: github.event.inputs.apply_fixes == 'true' || github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if git diff --staged --quiet; then
          echo "No formatting changes to commit"
        else
          git commit -m "style: auto-format code with black, isort, and autopep8"
          git push
        fi

  security-fixes:
    name: Automated Security Fixes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run safety check
      run: |
        safety check --output safety-report.json --format json

    - name: Run bandit security scan
      run: |
        bandit -r mcp_server -f json -o bandit-report.json

    - name: Generate security fix suggestions
      run: |
        echo "# Security Fix Suggestions" > security-fixes.md
        echo "" >> security-fixes.md

        # Parse safety results
        if [ -f safety-report.json ]; then
          echo "## Vulnerable Dependencies" >> security-fixes.md
          jq -r '.issues[] | "- \(.package): \(.vulnerability) (\(.severity))"' safety-report.json >> security-fixes.md 2>/dev/null || echo "- No dependency vulnerabilities found" >> security-fixes.md
          echo "" >> security-fixes.md
        fi

        # Parse bandit results
        if [ -f bandit-report.json ]; then
          echo "## Code Security Issues" >> security-fixes.md
          jq -r '.results // empty | to_entries[] | select(.value != []) | "- \(.key): \(.value | length) security issues"' bandit-report.json >> security-fixes.md 2>/dev/null || echo "- No code security issues found" >> security-fixes.md
          echo "" >> security-fixes.md
        fi

        echo "## Recommended Actions" >> security-fixes.md
        echo "1. Update vulnerable dependencies to latest secure versions" >> security-fixes.md
        echo "2. Review and fix code security issues" >> security-fixes.md
        echo "3. Run security scans regularly" >> security-fixes.md
        echo "4. Consider using virtual environments for dependency isolation" >> security-fixes.md

    - name: Upload security fix suggestions
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-fixes
        path: security-fixes.md

  performance-optimization:
    name: Performance Optimization Suggestions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install performance analysis tools
      run: |
        pip install radon mccabe pylint

    - name: Analyze code complexity
      run: |
        echo "# Performance Optimization Suggestions" > performance-optimizations.md
        echo "" >> performance-optimizations.md

        echo "## Code Complexity Analysis" >> performance-optimizations.md
        echo "\`\`\`" >> performance-optimizations.md
        radon cc mcp_server/ --min C --sort >> performance-optimizations.md 2>/dev/null || echo "No complex functions found" >> performance-optimizations.md
        echo "\`\`\`" >> performance-optimizations.md
        echo "" >> performance-optimizations.md

        echo "## Maintainability Index" >> performance-optimizations.md
        echo "\`\`\`" >> performance-optimizations.md
        radon mi mcp_server/ >> performance-optimizations.md 2>/dev/null || echo "Could not calculate maintainability index" >> performance-optimizations.md
        echo "\`\`\`" >> performance-optimizations.md
        echo "" >> performance-optimizations.md

        echo "## Recommendations" >> performance-optimizations.md
        echo "- Functions with complexity > 10 should be refactored" >> performance-optimizations.md
        echo "- Consider breaking down large functions into smaller ones" >> performance-optimizations.md
        echo "- Use async/await for I/O bound operations" >> performance-optimizations.md
        echo "- Implement caching for expensive operations" >> performance-optimizations.md
        echo "- Profile code with cProfile for performance bottlenecks" >> performance-optimizations.md

    - name: Upload performance suggestions
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-optimizations
        path: performance-optimizations.md

  create-improvement-pr:
    name: Create Improvement PR
    runs-on: ubuntu-latest
    needs: [code-formatting, security-fixes, performance-optimization]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_fixes == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create improvement branch
      run: |
        git checkout -b automated-improvements-$(date +%Y%m%d-%H%M%S)

    - name: Apply automated fixes
      run: |
        # Apply any automated fixes here
        echo "Applying automated improvements..."

    - name: Commit improvements
      run: |
        git add -A
        if git diff --staged --quiet; then
          echo "No improvements to commit"
          exit 0
        fi

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "feat: automated code improvements

- Applied code formatting with black and isort
- Fixed linting issues with autopep8
- Security improvements and suggestions
- Performance optimization recommendations"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: automated-improvements-${{ github.run_id }}
        title: "🤖 Automated Code Improvements"
        body: |
          ## Automated Code Improvements

          This PR contains automated improvements to the codebase:

          ### Changes Applied:
          - ✅ Code formatting with Black
          - ✅ Import sorting with isort
          - ✅ Linting fixes with autopep8

          ### Analysis Results:
          - 📊 Security scan completed
          - 📈 Performance analysis completed
          - 🔍 Code quality metrics updated

          ### Next Steps:
          - Review the analysis results in the workflow artifacts
          - Address any security vulnerabilities
          - Consider performance optimization suggestions
          - Test the changes thoroughly

          ---
          *This PR was created automatically by the code improvement workflow.*
        labels: |
          automated
          improvements
          maintenance