name: Fetch Secrets from Bitwarden

# Reusable workflow to retrieve secrets from Bitwarden for CI/CD tools
# This workflow logs into Bitwarden using provided credentials and fetches
# all required secrets for the analysis tools, making them available as outputs

on:
  workflow_call:
    secrets:
      BW_USERNAME:
        required: true
        description: Bitwarden username/email for login
      BW_PASSWORD:
        required: true
        description: Bitwarden master password for login
      BW_HOST:
        required: false
        description: Bitwarden server URL (optional, defaults to bitwarden.com)
    outputs:
      snyk_token:
        description: Snyk API token
        value: ${{ jobs.fetch.outputs.snyk_token }}
      sonar_token:
        description: SonarQube/SonarCloud token
        value: ${{ jobs.fetch.outputs.sonar_token }}
      sonar_host_url:
        description: SonarQube server URL
        value: ${{ jobs.fetch.outputs.sonar_host_url }}
      codacy_api_token:
        description: Codacy API token
        value: ${{ jobs.fetch.outputs.codacy_api_token }}
      codacy_project_token:
        description: Codacy project token
        value: ${{ jobs.fetch.outputs.codacy_project_token }}
      openai_api_key:
        description: OpenAI API key for CodeRabbitAI
        value: ${{ jobs.fetch.outputs.openai_api_key }}
      qono_api_key:
        description: Qono API key
        value: ${{ jobs.fetch.outputs.qono_api_key }}
      rhda_api_key:
        description: Red Hat Dependency Analytics API key
        value: ${{ jobs.fetch.outputs.rhda_api_key }}
      slack_webhook:
        description: Slack webhook URL for notifications
        value: ${{ jobs.fetch.outputs.slack_webhook }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      snyk_token: ${{ steps.set-outputs.outputs.snyk_token }}
      sonar_token: ${{ steps.set-outputs.outputs.sonar_token }}
      sonar_host_url: ${{ steps.set-outputs.outputs.sonar_host_url }}
      codacy_api_token: ${{ steps.set-outputs.outputs.codacy_api_token }}
      codacy_project_token: ${{ steps.set-outputs.outputs.codacy_project_token }}
      openai_api_key: ${{ steps.set-outputs.outputs.openai_api_key }}
      qono_api_key: ${{ steps.set-outputs.outputs.qono_api_key }}
      rhda_api_key: ${{ steps.set-outputs.outputs.rhda_api_key }}
      slack_webhook: ${{ steps.set-outputs.outputs.slack_webhook }}
    steps:
      - name: Login to Bitwarden and retrieve secrets
        uses: bitwarden/gh-actions@v1
        with:
          server_url: ${{ secrets.BW_HOST || 'https://vault.bitwarden.com' }}
          username: ${{ secrets.BW_USERNAME }}
          password: ${{ secrets.BW_PASSWORD }}
          secrets: |
            SNYK_TOKEN: op://private/snyk/token
            SONAR_TOKEN: op://private/sonarqube/token
            SONAR_HOST_URL: op://private/sonarqube/host_url
            CODACY_API_TOKEN: op://private/codacy/api_token
            CODACY_PROJECT_TOKEN: op://private/codacy/project_token
            OPENAI_API_KEY: op://private/openai/api_key
            QONO_API_KEY: op://private/qono/api_key
            RHDA_API_KEY: op://private/redhat/api_key
            SLACK_WEBHOOK: op://private/slack/webhook

      - name: Set workflow outputs
        id: set-outputs
        run: |
          echo "snyk_token=${{ env.SNYK_TOKEN }}" >> $GITHUB_OUTPUT
          echo "sonar_token=${{ env.SONAR_TOKEN }}" >> $GITHUB_OUTPUT
          echo "sonar_host_url=${{ env.SONAR_HOST_URL }}" >> $GITHUB_OUTPUT
          echo "codacy_api_token=${{ env.CODACY_API_TOKEN }}" >> $GITHUB_OUTPUT
          echo "codacy_project_token=${{ env.CODACY_PROJECT_TOKEN }}" >> $GITHUB_OUTPUT
          echo "openai_api_key=${{ env.OPENAI_API_KEY }}" >> $GITHUB_OUTPUT
          echo "qono_api_key=${{ env.QONO_API_KEY }}" >> $GITHUB_OUTPUT
          echo "rhda_api_key=${{ env.RHDA_API_KEY }}" >> $GITHUB_OUTPUT
          echo "slack_webhook=${{ env.SLACK_WEBHOOK }}" >> $GITHUB_OUTPUT