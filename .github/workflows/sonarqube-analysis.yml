name: SonarQube Analysis

# Generic SonarQube/SonarCloud Code Quality Analysis Template
# Supports multiple languages and quality gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest --cov=mcp_server --cov-report=xml --cov-report=term-missing

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        # Additional configuration
        args: >
          -Dsonar.organization=cbwinslow
          -Dsonar.projectKey=opendiscourse-mcp
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.sources=mcp_server,tests
          -Dsonar.tests=tests
          -Dsonar.python.version=3.11
          -Dsonar.exclusions=**/migrations/**,**/static/**,**/media/**,**/*.pyc,**/__pycache__/**
          -Dsonar.coverage.exclusions=**/tests/**,**/*test*.py

  # Alternative: Self-hosted SonarQube
  sonarqube-self-hosted:
    name: SonarQube Self-Hosted Analysis
    runs-on: ubuntu-latest
    if: ${{ false }}  # Enable this if using self-hosted SonarQube

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest --cov=mcp_server --cov-report=xml --cov-report=term-missing

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.projectKey=opendiscourse-mcp
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.sources=mcp_server,tests
          -Dsonar.tests=tests
          -Dsonar.python.version=3.11
          -Dsonar.exclusions=**/migrations/**,**/static/**,**/media/**,**/*.pyc,**/__pycache__/**
          -Dsonar.coverage.exclusions=**/tests/**,**/*test*.py

  # Quality Gate Check
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Quality Gate
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        # Enable this to fail the workflow on quality gate failure
        # fail-on-quality-gate-error: true