name: Codacy Security Scan

# Generic Codacy Code Quality and Security Analysis Template
# Supports multiple languages and integrates with Codacy dashboard

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 4 AM UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Codacy Analysis CLI
      uses: codacy/git-version@2.7.1
      with:
        release-branch: main
        codacy-api-token: ${{ secrets.CODACY_API_TOKEN }}
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        # Optional: Configure analysis
        # codacy-cli-args: "--verbose --force-file-permissions"

    # Alternative: Use Codacy GitHub Action
    - name: Run Codacy GitHub Action
      uses: codacy/codacy-analysis-cli-action@master
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        # Optional: Specify files to analyze
        # files: "mcp_server/**/*.py"
        # Optional: Specify analysis configuration
        # upload: true
        # gh-code-scanning-compat: true

  # Codacy Coverage Reporter (if you want to send coverage data)
  codacy-coverage:
    name: Codacy Coverage
    runs-on: ubuntu-latest
    needs: codacy-security-scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest --cov=mcp_server --cov-report=xml --cov-report=term-missing

    - name: Run Codacy Coverage Reporter
      uses: codacy/codacy-coverage-reporter-action@master
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.xml

  # Pull Request Analysis
  pr-analysis:
    name: PR Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Codacy PR Analysis
      uses: codacy/codacy-analysis-cli-action@master
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        upload: true
        gh-code-scanning-compat: true
        max-allowed-issues: 100  # Adjust threshold as needed