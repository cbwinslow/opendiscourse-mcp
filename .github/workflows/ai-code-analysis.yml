name: AI-Powered Code Analysis & Suggestions

# Generic AI-Powered Code Analysis and Improvement Suggestions Template
# Uses multiple AI tools to analyze code and provide suggestions

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Fridays at 6 AM UTC
    - cron: '0 6 * * 5'
  workflow_dispatch:

jobs:
  ai-code-analysis:
    name: AI Code Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # GitHub Copilot Chat Analysis (manual trigger)
    - name: GitHub Copilot Analysis
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "🤖 GitHub Copilot Analysis"
        echo "To get AI-powered analysis:"
        echo "1. Open this PR in GitHub"
        echo "2. Use GitHub Copilot Chat to analyze code"
        echo "3. Ask for suggestions on:"
        echo "   - Code improvements"
        echo "   - Security vulnerabilities"
        echo "   - Performance optimizations"
        echo "   - Best practices"

    # OpenAI GPT Analysis (requires API key)
    - name: OpenAI GPT Code Analysis
      if: env.OPENAI_API_KEY != ''
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pip install openai
        python -c "
        import openai
        import os
        import glob

        client = openai.OpenAI(api_key=os.environ['OPENAI_API_KEY'])

        # Analyze key files
        files_to_analyze = [
            'mcp_server/main.py',
            'mcp_server/utils/monitoring.py',
            'requirements.txt'
        ]

        analysis_results = []

        for file_path in files_to_analyze:
            if os.path.exists(file_path):
                with open(file_path, 'r') as f:
                    content = f.read()[:4000]  # Limit content length

                try:
                    response = client.chat.completions.create(
                        model='gpt-4',
                        messages=[
                            {'role': 'system', 'content': 'You are an expert Python code reviewer. Analyze the code for improvements, security issues, and best practices.'},
                            {'role': 'user', 'content': f'Analyze this Python file ({file_path}) and provide suggestions:\\n\\n{content}'}
                        ],
                        max_tokens=1000
                    )

                    analysis_results.append(f'## {file_path}\\n{response.choices[0].message.content}\\n')
                except Exception as e:
                    analysis_results.append(f'## {file_path}\\nError analyzing file: {e}\\n')

        with open('ai-analysis.md', 'w') as f:
            f.write('# AI Code Analysis Results\\n\\n')
            f.writelines(analysis_results)
        "
      continue-on-error: true

    # Claude/Anthropic Analysis (if available)
    - name: Claude Code Analysis
      if: env.ANTHROPIC_API_KEY != ''
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        pip install anthropic
        python -c "
        import anthropic
        import os

        client = anthropic.Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])

        # Simple analysis of main file
        if os.path.exists('mcp_server/main.py'):
            with open('mcp_server/main.py', 'r') as f:
                content = f.read()[:3000]

            try:
                response = client.messages.create(
                    model='claude-3-sonnet-20240229',
                    max_tokens=1000,
                    messages=[
                        {'role': 'user', 'content': f'Analyze this Python FastAPI application and suggest improvements:\\n\\n{content}'}
                    ]
                )

                with open('claude-analysis.md', 'w') as f:
                    f.write('# Claude Code Analysis\\n\\n')
                    f.write(response.content[0].text)
            except Exception as e:
                print(f'Claude analysis failed: {e}')
        "
      continue-on-error: true

    # DeepCode/Snyk Code Analysis (already covered in other workflows)
    - name: Additional AI Analysis Notes
      run: |
        echo "## Additional AI Analysis Tools Available:"
        echo "- GitHub Copilot: Use in IDE or GitHub interface"
        echo "- Tabnine: AI code completion and analysis"
        echo "- Kite: AI-powered coding assistant"
        echo "- Codota: AI code suggestions"
        echo "- Sourcegraph: AI-powered code search and analysis"

    # Upload analysis results
    - name: Upload AI Analysis Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ai-analysis-results
        path: |
          ai-analysis.md
          claude-analysis.md
        if-no-files-found: ignore

  # Automated Code Suggestions
  code-suggestions:
    name: Automated Code Suggestions
    runs-on: ubuntu-latest
    needs: ai-code-analysis

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install code analysis tools
      run: |
        pip install autopep8 black isort pylint radon

    - name: Generate Code Suggestions
      run: |
        echo "# Automated Code Improvement Suggestions" > code-suggestions.md
        echo "" >> code-suggestions.md

        echo "## Code Quality Metrics" >> code-suggestions.md
        echo "\`\`\`" >> code-suggestions.md
        radon cc mcp_server/ --min B --sort >> code-suggestions.md 2>/dev/null || echo "No complexity issues found" >> code-suggestions.md
        echo "\`\`\`" >> code-suggestions.md
        echo "" >> code-suggestions.md

        echo "## Import Sorting Suggestions" >> code-suggestions.md
        echo "\`\`\`" >> code-suggestions.md
        isort --check-only --diff mcp_server/ >> code-suggestions.md 2>/dev/null || echo "Imports are properly sorted" >> code-suggestions.md
        echo "\`\`\`" >> code-suggestions.md
        echo "" >> code-suggestions.md

        echo "## Linting Suggestions" >> code-suggestions.md
        echo "\`\`\`" >> code-suggestions.md
        pylint mcp_server/ --output-format=text --reports=no --score=no >> code-suggestions.md 2>/dev/null || echo "No major linting issues" >> code-suggestions.md
        echo "\`\`\`" >> code-suggestions.md

    - name: Upload Code Suggestions
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-suggestions
        path: code-suggestions.md