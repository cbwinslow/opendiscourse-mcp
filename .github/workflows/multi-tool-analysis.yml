name: Multi-Tool Code Analysis Suite

# Generic Multi-Tool Code Analysis Suite Template
# Runs multiple analysis tools in parallel for comprehensive feedback

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Saturdays at 3 AM UTC
    - cron: '0 3 * * 6'
  workflow_dispatch:

jobs:
  # Parallel analysis jobs
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install analysis tools
      run: |
        pip install flake8 pylint mypy bandit safety radon

    - name: Run flake8
      run: flake8 mcp_server tests --max-line-length=127 --extend-ignore=E203,W503

    - name: Run pylint
      run: pylint mcp_server --output-format=text --reports=no

    - name: Run mypy
      run: mypy mcp_server --ignore-missing-imports

    - name: Run bandit
      run: bandit -r mcp_server -f json -o static-bandit.json

    - name: Run safety
      run: safety check --output static-safety.json --format json

    - name: Run radon complexity
      run: radon cc mcp_server -j > static-complexity.json

    - name: Upload static analysis results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: static-analysis-results
        path: |
          static-bandit.json
          static-safety.json
          static-complexity.json

  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependency tools
      run: |
        pip install pipdeptree pip-audit

    - name: Generate dependency tree
      run: pipdeptree --json > dependency-tree.json

    - name: Run pip-audit
      run: pip-audit --format json > dependency-audit.json || true

    - name: Check for outdated packages
      run: pip list --outdated --format json > outdated-packages.json

    - name: Upload dependency analysis
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-analysis
        path: |
          dependency-tree.json
          dependency-audit.json
          outdated-packages.json

  container-analysis:
    name: Container Analysis
    runs-on: ubuntu-latest
    if: exists('Dockerfile')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t analysis-target .

    - name: Run Trivy container scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        scan-ref: 'analysis-target'
        format: 'sarif'
        output: 'container-trivy.sarif'

    - name: Run Dive for image efficiency
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          wagoodman/dive:latest analysis-target --ci --json > container-dive.json

    - name: Upload container analysis
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: container-trivy.sarif

    - name: Upload container efficiency results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: container-analysis
        path: container-dive.json

  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install performance tools
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-benchmark memory-profiler line-profiler

    - name: Run basic performance tests
      run: |
        python -m pytest tests/ -k "performance or benchmark" --benchmark-json=performance-results.json || echo "No performance tests found"

    - name: Memory profiling
      run: |
        python -c "
        from mcp_server.main import app
        import tracemalloc
        tracemalloc.start()
        # Simple memory usage check
        import psutil
        import os
        process = psutil.Process(os.getpid())
        memory_info = process.memory_info()
        print(f'Memory usage: {memory_info.rss / 1024 / 1024:.2f} MB')
        " > memory-profile.txt

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-analysis
        path: |
          performance-results.json
          memory-profile.txt

  coverage-analysis:
    name: Coverage Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov coverage

    - name: Run tests with coverage
      run: |
        pytest --cov=mcp_server --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Generate coverage badge
      run: |
        coverage report --format=total | grep TOTAL | awk '{print $4}' > coverage-percentage.txt

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
          coverage-percentage.txt

  # Summary and reporting job
  analysis-summary:
    name: Analysis Summary Report
    runs-on: ubuntu-latest
    needs: [static-analysis, dependency-analysis, performance-analysis, coverage-analysis]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all analysis artifacts
      uses: actions/download-artifact@v3

    - name: Generate comprehensive report
      run: |
        echo "# 🔍 Multi-Tool Code Analysis Report" > analysis-summary.md
        echo "" >> analysis-summary.md
        echo "Generated on: $(date)" >> analysis-summary.md
        echo "" >> analysis-summary.md

        # Coverage summary
        if [ -f "coverage-reports/coverage-percentage.txt" ]; then
          COVERAGE=$(cat coverage-reports/coverage-percentage.txt)
          echo "## 📊 Test Coverage: ${COVERAGE}%" >> analysis-summary.md
          echo "" >> analysis-summary.md
        fi

        # Security summary
        if [ -f "static-analysis-results/static-bandit.json" ]; then
          SECURITY_ISSUES=$(jq '.results | flatten | length' static-analysis-results/static-bandit.json 2>/dev/null || echo "0")
          echo "## 🔒 Security Issues: ${SECURITY_ISSUES}" >> analysis-summary.md
          echo "" >> analysis-summary.md
        fi

        # Dependency issues
        if [ -f "dependency-analysis/dependency-audit.json" ]; then
          DEP_ISSUES=$(jq '. | length' dependency-analysis/dependency-audit.json 2>/dev/null || echo "0")
          echo "## 📦 Dependency Vulnerabilities: ${DEP_ISSUES}" >> analysis-summary.md
          echo "" >> analysis-summary.md
        fi

        # Performance summary
        if [ -f "performance-analysis/performance-results.json" ]; then
          echo "## ⚡ Performance Analysis" >> analysis-summary.md
          echo "Performance benchmarks completed" >> analysis-summary.md
          echo "" >> analysis-summary.md
        fi

        echo "## 📋 Recommendations" >> analysis-summary.md
        echo "" >> analysis-summary.md
        echo "### Immediate Actions:" >> analysis-summary.md
        echo "- Review security vulnerabilities and fix critical issues" >> analysis-summary.md
        echo "- Update outdated dependencies" >> analysis-summary.md
        echo "- Address code quality issues from static analysis" >> analysis-summary.md
        echo "" >> analysis-summary.md
        echo "### Continuous Improvement:" >> analysis-summary.md
        echo "- Maintain test coverage above 80%" >> analysis-summary.md
        echo "- Run security scans regularly" >> analysis-summary.md
        echo "- Monitor performance metrics" >> analysis-summary.md
        echo "- Keep dependencies updated" >> analysis-summary.md

    - name: Upload analysis summary
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: analysis-summary
        path: analysis-summary.md

    - name: Comment PR with summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('analysis-summary.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });