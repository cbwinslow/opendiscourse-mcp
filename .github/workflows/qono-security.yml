name: Qono Security Analysis

# Generic Qono Security Scanning Template
# Advanced security analysis with policy enforcement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 5 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  qono-security-scan:
    name: Qono Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Qono Security Scan
      uses: qonto/qonto-action@v1
      env:
        QONO_API_TOKEN: ${{ secrets.QONO_API_TOKEN }}
      with:
        # Optional: Configure scan behavior
        # working-directory: .
        # config-file: .qono/config.yml
        # fail-on-policy-violations: true
        # severity-threshold: high
        # exclude-patterns: "**/tests/**,**/migrations/**"
        # include-patterns: "**/*.py,**/*.js,**/*.ts"

    # Alternative: Qono CLI approach
    - name: Install Qono CLI
      run: |
        curl -fsSL https://get.qonto.com/install.sh | bash
      if: ${{ false }}  # Enable if using CLI instead of action

    - name: Run Qono CLI Scan
      run: |
        qonto scan --token ${{ secrets.QONO_API_TOKEN }} --format sarif --output qono-results.sarif
      if: ${{ false }}  # Enable if using CLI instead of action

    - name: Upload Qono results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: qono-results.sarif

  # Policy Check
  qono-policy-check:
    name: Qono Policy Check
    runs-on: ubuntu-latest
    needs: qono-security-scan
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Qono Policy Validation
      uses: qonto/qonto-action@v1
      env:
        QONO_API_TOKEN: ${{ secrets.QONO_API_TOKEN }}
      with:
        fail-on-policy-violations: true
        severity-threshold: medium