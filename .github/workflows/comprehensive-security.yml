name: Comprehensive Security & Quality Analysis

# Generic Comprehensive Security and Code Quality Analysis Template
# Combines multiple tools for thorough analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Wednesdays at 2 AM UTC
    - cron: '0 2 * * 3'
  workflow_dispatch:

jobs:
  # Bandit - Python security linter
  bandit-security:
    name: Bandit Security Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bandit
      run: |
        pip install bandit
        bandit -r mcp_server -f json -o bandit-report.json --severity-level medium || true

    - name: Upload Bandit results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-results
        path: bandit-report.json

  # Safety - Python dependency vulnerability scanner
  safety-check:
    name: Safety Dependency Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Safety
      run: |
        pip install safety
        safety check --output safety-report.json --format json || true

    - name: Upload Safety results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: safety-results
        path: safety-report.json

  # Semgrep - Semantic code analysis
  semgrep-analysis:
    name: Semgrep Code Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        # Optional: Configure rules
        config: p/python
        # Optional: Generate SARIF output
        generateSarif: "1"
        # Optional: Upload to Semgrep App
        # publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
        # publishDeployment: 1

    - name: Upload Semgrep results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep.sarif

  # Trivy - Container and filesystem vulnerability scanner
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        # Optional: Configure severity
        # severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

  # OWASP ZAP - Web application security scanner
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    if: ${{ false }}  # Enable if you have a running application to scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start application
      run: |
        # Start your application here
        # python -m uvicorn mcp_server.main:app --host 0.0.0.0 --port 8000 &
        echo "Application startup would go here"

    - name: ZAP Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

    # Container scan with Trivy (if Dockerfile exists)
    container-trivy:
      name: Trivy Container Scan
      runs-on: ubuntu-latest
      if: exists('Dockerfile')

      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run Trivy on container
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'my-app'
          format: 'sarif'
          output: 'trivy-container.sarif'

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-container.sarif

  # Summary report
  security-summary:
    name: Security Analysis Summary
    runs-on: ubuntu-latest
    needs: [bandit-security, safety-check, semgrep-analysis, trivy-scan]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate Security Summary
      run: |
        echo "# Security Analysis Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results" >> security-summary.md
        echo "" >> security-summary.md

        # Bandit results
        if [ -f "bandit-results/bandit-report.json" ]; then
          echo "### Bandit Security Linting" >> security-summary.md
          jq -r '.results // empty | to_entries[] | "- \(.key): \(.value | length) issues"' bandit-results/bandit-report.json >> security-summary.md 2>/dev/null || echo "- No critical issues found" >> security-summary.md
          echo "" >> security-summary.md
        fi

        # Safety results
        if [ -f "safety-results/safety-report.json" ]; then
          echo "### Safety Dependency Check" >> security-summary.md
          jq -r '.issues // empty | length' safety-results/safety-report.json | xargs -I {} echo "- {} vulnerabilities found" >> security-summary.md 2>/dev/null || echo "- No vulnerabilities found" >> security-summary.md
          echo "" >> security-summary.md
        fi

        echo "## Recommendations" >> security-summary.md
        echo "- Review all high and critical severity issues" >> security-summary.md
        echo "- Update vulnerable dependencies" >> security-summary.md
        echo "- Address security linting violations" >> security-summary.md
        echo "- Consider container security best practices" >> security-summary.md

    - name: Upload Security Summary
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-summary
        path: security-summary.md